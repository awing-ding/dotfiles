version = 2
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

[[blocks]]
    type = 'prompt'
    alignment = 'left'

    [[blocks.segments]]
        type = 'path'
        style = 'plain'
        background = 'transparent'
        foreground = 'blue'
        template = '{{ .Path }}'
        [block.segments.properties]
            style = 'Powerlevel'
    
    [[blocks.segments]]
        type = 'git'
        style = 'plain'
        foreground = '#c6c6c6'
        background = 'transparent'
        template = ' {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} <cyan>{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}</>' 
        
        [blocks.segments.properties]
            branch_icon = ''
            commit_icon = '@'
            fetch_status = true


[[blocks]]
    type = 'prompt'
    alignment = 'left'
    newline = true

    [[blocks.segments]]
        type = 'text'
        style = 'plain'
        foreground = 'yellow'
        background = 'transparent'
        template = '>'

[transient_prompt]
    foreground = 'yellow'
    background = 'transparent'
    template = '> '
